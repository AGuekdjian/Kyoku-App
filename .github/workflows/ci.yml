name: Quality gate
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kyoku_ci
          AUTH_SECRET: ci-only-placeholder-secret-at-least-32-characters
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kyoku_ci
          AUTH_SECRET: ci-only-placeholder-secret-at-least-32-characters
