services:
  app:
    build:
      context: .
      target: development
    env_file: .env.local
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - kyoku_node_modules:/app/node_modules
      - kyoku_next:/app/.next
      - kyoku_uploads:/app/.data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true

volumes:
  kyoku_node_modules:
  kyoku_next:
  kyoku_uploads:
